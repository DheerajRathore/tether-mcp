name: Build Tether (test)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Use macos-14 to guarantee we don't hit the Xcode "future format" error
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version from Xcode project
        id: ver
        run: |
          echo "Extracting version directly from project.pbxproj..."
          
          # Read the version directly from the Xcode project file (grep the MARKETING_VERSION)
          VERSION=$(grep -m 1 "MARKETING_VERSION = " Tether/Tether.xcodeproj/project.pbxproj | sed 's/.*MARKETING_VERSION = \(.*\);/\1/' | tr -d '[:space:]')
          
          # Fallback if the above fails: try reading from Info.plist
          if [ -z "$VERSION" ]; then
            VERSION=$(defaults read "$PWD/Tether/Tether/Info.plist" CFBundleShortVersionString 2>/dev/null || true)
          fi
          
          if [ -z "$VERSION" ]; then
            echo "::error::Could not find version."
            exit 1
          fi
          
          echo "Successfully found version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: ./Tether/scripts/build-dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Upload DMG as downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tether-${{ steps.ver.outputs.version }}
          path: |
            Tether/Tether-${{ steps.ver.outputs.version }}.dmg
            Tether/Tether-${{ steps.ver.outputs.version }}.dmg.sha256
          retention-days: 14
